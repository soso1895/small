name: T2 Build x86_64 25.12

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Input: empty/*=default packages, or package name(s)'
        required: false
        default: ''

jobs:

  build:

    name: build x86_64-25.12.0

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6.0.2

        with:
          fetch-depth: 0


      - name: Get packages to build

        id: packages

        run: |

          input="${{ github.event.inputs.plugins }}"

          if [ -z "$input" ] || [ "$input" == "*" ]; then

            PACKAGES="luci-app-passwall luci-app-passwall2 xray-plugin v2ray-core v2ray-geodata sing-box hysteria ipt2socks pdnsd-alt redsocks2 shadow-tls trojan tuic-client naiveproxy"

            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          else

            echo "packages=$input" >> $GITHUB_OUTPUT

          fi


      - name: Build

        uses: kenzok8/gh-action-sdk@hash

        env:

          CONTAINER: immortalwrt/sdk

          ARCH: x86_64-openwrt-25.12.0

          FEEDNAME: packages_ci

          PACKAGES: ${{ steps.packages.outputs.packages }}

          NO_REFRESH_CHECK: true

          IGNORE_ERRORS: true

          INDEX: 1

          GOLANG_REPO: https://github.com/kenzok8/golang

          GOLANG_BRANCH: '1.26'


      - name: Store packages

        uses: actions/upload-artifact@v7.0.0

        with:

          name: x86_64-25.12.0

          path: |

            bin/packages/x86_64/packages_ci/*.ipk

            bin/packages/x86_64/packages_ci/*.apk
