name: T2 Build x86_64 OpenWrt 25.12

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: '留空=默认PassWall相关包，或者输入指定包名'
        required: false
        default: ''

jobs:

  build:

    name: build x86_64-25.12.0

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v6.0.2

        with:
          fetch-depth: 0


      - name: Get packages

        id: packages

        run: |

          input="${{ github.event.inputs.plugins }}"

          if [ -z "$input" ] || [ "$input" == "*" ]; then

            PACKAGES="
            luci-app-passwall
            luci-app-passwall2
            xray-plugin
            v2ray-core
            v2ray-geodata
            v2ray-geoip
            v2ray-geosite
            sing-box
            hysteria
            hysteria2
            naiveproxy
            brook
            redsocks2
            ipt2socks
            dns2socks
            tcping
            chinadns-ng
            dnsmasq-full
            "

            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          else

            echo "packages=$input" >> $GITHUB_OUTPUT

          fi


      - name: Build

        uses: kenzok8/gh-action-sdk@hash

        env:

          CONTAINER: immortalwrt/sdk

          ARCH: x86_64-openwrt-25.12.0

          FEEDNAME: packages_ci

          PACKAGES: ${{ steps.packages.outputs.packages }}

          NO_REFRESH_CHECK: true

          IGNORE_ERRORS: true

          INDEX: 1


          GOLANG_REPO: https://github.com/kenzok8/golang

          GOLANG_BRANCH: '1.26'



      - name: Store packages

        uses: actions/upload-artifact@v7.0.0

        with:

          name: x86_64-openwrt-25.12-passwall

          path: |

            bin/packages/x86_64/packages_ci/*.ipk

            bin/packages/x86_64/packages_ci/*.apk



      - name: Show packages

        run: |

          echo "===== Build Result ====="

          ls -lh bin/packages/x86_64/packages_ci/
