name: Build PassWall Xray IPK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y zstd build-essential rsync


    - name: Download SDK
      run: |
        wget https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

        tar --use-compress-program=unzstd -xf openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

        mv openwrt-sdk-* sdk


    - name: Configure feeds
      run: |
        cd sdk

        cat > feeds.conf.default <<EOF
src-git packages https://github.com/openwrt/packages.git
src-git luci https://github.com/openwrt/luci.git
src-git routing https://github.com/openwrt/routing.git
src-git small https://github.com/kenzok8/small.git
EOF


    - name: Update feeds
      run: |
        cd sdk
        ./scripts/feeds update -a


    - name: Install packages
      run: |
        cd sdk

        ./scripts/feeds install -p small -f luci-app-passwall


    - name: Build PassWall
      run: |
        cd sdk

        make defconfig

        make package/feeds/small/luci-app-passwall/compile V=s


    - name: Collect ipk
      run: |
        mkdir output

        find sdk/bin/packages -name "*.ipk" -exec cp {} output/ \;


    - name: Upload
      uses: actions/upload-artifact@v4

      with:
        name: passwall-ipk
        path: output/
