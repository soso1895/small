name: Build PassWall Xray OpenWrt 25.12 x86_64


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Download OpenWrt SDK

      run: |

        wget https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

        tar --use-compress-program=unzstd -xf openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

        mv openwrt-sdk-* sdk


    - name: Copy small feed

      run: |

        cp feeds.conf.default sdk/feeds.conf.default


    - name: Update feeds

      run: |

        cd sdk

        ./scripts/feeds update -a

        ./scripts/feeds install -a


    - name: Configure

      run: |

        cd sdk

        make defconfig


    - name: Build packages

      run: |

        cd sdk

        make package/luci-app-passwall/compile V=s


    - name: Collect ipk

      run: |

        mkdir output

        find sdk/bin/packages -name "*.ipk" -exec cp {} output/ \;


    - name: Upload ipk

      uses: actions/upload-artifact@v4

      with:

        name: PassWall-Xray-OpenWrt25.12-x86_64

        path: output/
